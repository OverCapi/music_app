name: CI

on:
  pull_request:
  push:
    branches: [master]

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml
      - name: Linux system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libasound2-dev libxdo-dev librsvg2-dev libayatana-appindicator3-dev cmake
      - name: Frontend
        working-directory: app
        run: |
          pnpm install --frozen-lockfile
          pnpm check
          pnpm lint
          pnpm build
      - run: cargo fmt --all --check
        if: runner.os == 'Linux'
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
        if: runner.os != 'Windows'
      # The app's unit tests can't start on Windows (STATUS_ENTRYPOINT_NOT_FOUND: tauri test
      # binaries lack the common-controls v6 manifest); clippy --all-targets still compiles them.
      - run: cargo test --workspace --exclude music_app
        if: runner.os == 'Windows'
