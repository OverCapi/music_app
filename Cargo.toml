[workspace]
resolver = "3"
members = ["crates/protocol", "crates/server", "src-tauri"]

[workspace.package]
edition = "2024"
rust-version = "1.95"
license = "MIT"

[workspace.dependencies]
group-protocol = { path = "crates/protocol" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tokio = "1"
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
rusqlite = { version = "0.40", features = ["bundled"] }
rusqlite_migration = "2.6"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
specta = { version = "=2.0.0-rc.25", features = ["derive"] }
tokio-tungstenite = { version = "0.30", features = ["rustls-tls-webpki-roots"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
dbg_macro = "warn"
todo = "warn"
unwrap_used = "allow"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
