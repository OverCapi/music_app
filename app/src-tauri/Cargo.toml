[package]
name = "music_app"
version = "0.1.0"
description = "Desktop music player for local files"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lib]
# The `_lib` suffix keeps the lib name distinct from the bin name (cargo#8519 on Windows).
name = "music_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
group-protocol = { workspace = true, features = ["specta"] }
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-specta = { version = "=2.0.0-rc.25", features = ["derive", "typescript"] }
specta.workspace = true
specta-typescript = "0.0.12"
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
rusqlite.workspace = true
rusqlite_migration.workspace = true
rodio = { version = "0.22", default-features = false, features = ["playback", "symphonia-mp3"] }
lofty = "0.25"
symphonia = { version = "0.5", default-features = false, features = ["ogg"] }
symphonia-adapter-libopus = { version = "0.2", default-features = false, features = ["bundled"] }
tokio = { workspace = true, features = ["process", "io-util", "sync", "rt", "time", "macros", "fs", "net"] }
fastrand = "2"
trash = "5"
reqwest.workspace = true
tokio-tungstenite.workspace = true
futures-util.workspace = true
axum.workspace = true
getrandom.workspace = true
mdns-sd = "0.13"
if-addrs = "0.13"
tokio-util = { version = "0.7", features = ["io"] }

[lints]
workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
souvlaki = "0.8.3"
