<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%sveltekit.assets%/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Music App</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
    />
    <script>
      // Apply the saved mode and accent before first paint (see src/lib/stores/theme.svelte.ts).
      try {
        const m = localStorage.getItem("theme-mode");
        if (m) document.documentElement.dataset.mode = m;
        const a = localStorage.getItem("theme-accent");
        if (a) document.documentElement.style.setProperty("--accent-h", a);
      } catch {}
    </script>
    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover">
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
